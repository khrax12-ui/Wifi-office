<script>
(function(){
var K='acc_full_v1',D;

function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}

function iq(a,c){return c==='USD'?a*(D.set.rate||1):a}

var CI=['اشتراكات','تسديد مشترك','بيع أجهزة','أخرى'],CO=['مولد','رواتب','سلف','صيانة','شراء باقات','مخزون','تسديد مجهز','أخرى'];
function addTx(t,cat,a,c,n,date){D.tx.push({id:uid(),date:date||TD,type:t,cat:cat,a:a,c:c||'IQD',n:n||'',tm:new Date().toTimeString().slice(0,5),w:curW||'cash'})}
function sums(list){var i=0,o=0;list.forEach(function(x){var v=iq(x.a,x.c);if(x.type==='in')i+=v;else o+=v});return{i:i,o:o}}
function bal(id){var b=0;D.led.forEach(function(l){if(l.sub===id)b+=(l.k==='c'?1:-1)*iq(l.a,l.c)});return b}

  var h='<p class="h">'+title+'</p>'+fields.map(function(f){
    var inp=f.o?'<select id="q_'+f.k+'">'+f.o.map(function(o){return'<option>'+o+'</option>'}).join('')+'</select>':'<input id="q_'+f.k+'" type="'+(f.t||'text')+'" value="'+e(f.v||'')+'"'+(f.t==='num'?' inputmode="decimal"':'')+'>';
    return'<label class="f">'+f.l+'</label>'+inp}).join('')+'<p class="neg" id="qe"></p><button class="bt w" id="qok">حفظ</button>';

var sm=TD.slice(0,7);
